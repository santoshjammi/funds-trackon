version: '3.9'

services:
  mongo:
    image: mongo:7
    container_name: niveshya-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27019}:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=${DATABASE_NAME}
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping').ok", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - appnet

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: niveshya-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - MONGODB_URL=mongodb://mongo:27017/${DATABASE_NAME}
      - ENVIRONMENT=production
      - DEBUG=False
      - PORT=8001
      - JOPLIN_BASE_URL=http://host.docker.internal:41184
    volumes:
      - uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8001}:8001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - appnet

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        REACT_APP_API_BASE_URL: http://localhost:${BACKEND_PORT:-8001}
    container_name: niveshya-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "${FRONTEND_PORT:-3002}:80"
    depends_on:
      - backend
    networks:
      - appnet

volumes:
  mongo_data:
  uploads:

networks:
  appnet:
    driver: bridge
